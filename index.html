
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Campaign</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #1f2937;
    }
    .card {
      width: 100%;
      max-width: 520px;
      padding: 32px 26px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5eaf0;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(25,45,70,.08);
    }
    .mark {
      font-size: 32px;
      margin-bottom: 15px;
    }
    h1 { font-size: 25px; }
    p { color: #5b6573; line-height: 1.6; }
    button {
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      border: 0;
      border-radius: 9px;
      background: #163b63;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .note { margin-top: 18px; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✉️</div>
    <h1>Email Campaign</h1>
    <p>Tap the button below to open your email application with the recipients, subject and message pre-filled.</p>
    <button type="button" id="openEmail">Open Email Application</button>
    <p class="note">Please review the email before tapping Send.</p>
  </main>

  <script>
    const recipients = {
      to: ["atulranjan24@outlook.com"],
      cc: ["Raj.73564@gmail.com"],
      bcc: ["atulranjan24@gmail.com"]
    };

    const subject = "Test1";
    const body = "Testing mail body.";

    document.getElementById("openEmail").addEventListener("click", function () {
      const params = new URLSearchParams();

      if (recipients.cc.length)
        params.set("cc", recipients.cc.join(","));

      if (recipients.bcc.length)
        params.set("bcc", recipients.bcc.join(","));

      params.set("subject", subject);
      params.set("body", body);

      window.location.href =
        "mailto:" + recipients.to.join(",") + "?" + params.toString();
    });
  </script>
</body>
</html>
